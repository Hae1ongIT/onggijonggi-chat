# 배포(prod) 프로파일 전용 오버라이드. infra/docker-compose.yml이 SPRING_PROFILES_ACTIVE=prod로 활성화한다.
spring.flyway.enabled=true
# 모든 대화는 Tenant의 워크스페이스에 놓여야 한다. 권한 기능(casbin)을 켜지 않은 기본 배포도 기본 Tenant 하나를 만들도록
# 조직 구조 설정을 읽는다. docker-compose가 기본으로 infra/config/workspace-setup.default.yml을 이 경로에 마운트한다.
# casbin 프로필은 같은 경로를 준다(application-casbin.properties) — 그때는 WORKSPACE_SETUP_FILE로 실제 조직 구조 파일을 가리킨다.
app.rbac.workspace-setup-path=/config/workspace-setup.yml
